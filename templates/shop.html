<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин kito4kashop</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f5f5f5; }
    h1 { color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select { padding: 10px; margin: 5px 0; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #c9302c; }
    a { color: #d9534f; font-weight: bold; text-decoration: none; }
    hr { border: 0; border-top: 1px solid #ccc; width: 80%; margin: 20px auto; }
  </style>
</head>
<body>
  <h1>Магазин китов — kito4kashop</h1>

  <a href="/admin">Вход в админку</a>
  <hr>

  <div class="card">
    <form action="/buy" method="POST">
      <label><strong>Твой ник в игре:</strong></label><br>
      <input type="text" name="nickname" placeholder="Например: banmax777" required><br><br>

      <label><strong>Выбери кит:</strong></label><br>
      <select name="item">
        <option value="kit-demon-clan-1500k">Кит клана демона (1 500 000)</option>
        <option value="kit-banmax777-130k">Кит banmax777 (130 000)</option>
        <option value="kit-banmax777-2.0-250k">Кит banmax777 2.0 (250 000)</option>
        <option value="kit-security-70k">Кит сеферити (70 000)</option>
        <option value="kit-demon-non-clan-120k">Кит демона (не клан) (120 000)</option>
        <option value="kit-sponsor-300k">Кит спонсера (300 000)</option>
        <option value="kit-iqqo-300k">Кит iqqo (300 000)</option>
        <option value="kit-bot-bot-10k">Кит боты бота (10 000)</option>
        <option value="kit-mix-200k">Кит микс (200 000)</option>
        <option value="kit-toxic-120k">Кит токсик (120 000)</option>
      </select><br><br>

      <button type="submit">Купить</button>
    </form>
  </div>
</body>
</html>
