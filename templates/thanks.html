<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <title>Статус заказа | Kito4kaShop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f0f11;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #1a1a1d;
            padding: 35px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .status-box {
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin: 20px 0;
            text-transform: uppercase;
        }

        .status-pending { background-color: #ffc107; color: #000; box-shadow: 0 0 15px rgba(255, 193, 7, 0.4); }
        .status-accepted { background-color: #28a745; box-shadow: 0 0 15px rgba(40, 167, 69, 0.4); }
        .status-rejected { background-color: #dc3545; box-shadow: 0 0 15px rgba(220, 53, 69, 0.4); }

        .info-row {
            text-align: left;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .label {
            display: inline-block;
            width: 140px;
            font-weight: bold;
            color: #aaa;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-back {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(180deg, #ffd700 0%, #d4af37 100%);
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .auto-note {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📦 Статус заказа</h1>

        <div class="status-box status-{{ status }}">
            Статус: {{ status|upper }}
        </div>

        <div class="info-row">
            <span class="label">ID заказа:</span> {{ order_id }}
        </div>
        <div class="info-row">
            <span class="label">Никнейм:</span> {{ nickname }}
        </div>
        <div class="info-row">
            <span class="label">Товар:</span> {{ item }}
        </div>

        {% if admin_comment %}
            <div class="info-row" style="border-top:1px solid #333; padding-top:12px;">
                <span class="label">Комментарий админа:</span><br>
                <strong>{{ admin_comment }}</strong>
            </div>
        {% endif %}

        <a href="/" class="btn-back">← Вернуться в магазин</a>
        <p class="auto-note">Автообновление страницы каждые 10 сек.</p>
    </div>
</body>
</html>
