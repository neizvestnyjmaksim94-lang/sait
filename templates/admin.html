<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка</title>
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f0f11;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
        }

        .login-form {
            max-width: 350px;
            margin: 50px auto;
            background: #1a1a1d;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            background: #0f0f11;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .login-form input:focus {
            border-color: #ffd700;
            outline: none;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            color: #000;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
        }
        .login-form button:hover {
            background: #ffe082;
        }
        .error-msg {
            color: #ff5252;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: #1a1a1d;
            border: 1px solid #333;
        }
        .orders-table th {
            background: #252529;
            padding: 15px;
            text-align: left;
            color: #aaa;
            border-bottom: 1px solid #444;
        }
        .orders-table td {
            padding: 15px;
            border-bottom: 1px solid #333;
            color: #e0e0e0;
        }
        .status-pending { color: #ffc107; }
        .status-accepted { color: #28a745; }
        .status-rejected { color: #dc3545; }

        .actions button {
            padding: 5px 10px;
            margin-right: 5px;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 12px;
        }
