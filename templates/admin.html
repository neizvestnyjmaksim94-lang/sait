<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка kito4kashop</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
    h1, h2 { color: #333; text-align: center; }
    .login-box, .admin-box { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { padding: 10px; width: 100%; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #222; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Админка kito4kashop</h1>

  {% if not logged_in %}
  <div class="login-box">
    <h2>Вход</h2>
    <form method="POST">
      <!-- Никаких placeholder'ов и подсказок -->
      <input type="text" name="login" required>
      <input type="password" name="password" required>
      <button type="submit">Войти</button>
    </form>
  </div>
  {% else %}
  <div class="admin-box">
    <h2>Все заявки</h2>
    {% if orders %}
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Ник</th>
          <th>Кит</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody>
        {% for order in orders %}
        <tr>
          <td>{{ order.id }}</td>
          <td>{{ order.nickname }}</td>
          <td>{{ order.item }}</td>
          <td>{{ order.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p style="text-align:center;">Пока нет заявок.</p>
    {% endif %}
  </div>
  {% endif %}
</body>
</html>
