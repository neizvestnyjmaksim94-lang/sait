<!DOCTYPE html>
<html>
<head>
    <title>Подача заявки</title>
    <meta charset="utf-8">
    <style>
        .form-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Подача заявки</h1>
        <form id="requestForm">
            <div class="form-group">
                <label for="username">Ваше игровое имя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <button type="submit">Отправить заявку</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();
                if (response.ok) {
                    messageDiv.className = 'message success';
                    if (data.redirect) {
                        messageDiv.textContent = 'Заявка отправлена! Переходим на страницу ожидания...';
                        setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            } else {
                messageDiv.textContent = data.message;
            }
        } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = data.message || 'Ошибка отправки заявки';
        }
    } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Ошибка сети';
    }
});
</script>
</body>
</html>
